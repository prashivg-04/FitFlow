name: FitFlow K8s CI/CD

on:
  workflow_dispatch:

jobs:
    # ─────────────────────────────────────────────
    # Job 1: Test
    # ─────────────────────────────────────────────
    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22

            - name: Install backend dependencies
              working-directory: Backend
              run: npm ci

            - name: Run backend tests
              working-directory: Backend
              run: echo "No tests implemented yet"
            
            - name: Install frontend dependencies
              working-directory: Frontend
              run: npm ci

            - name: Run frontend tests
              working-directory: Frontend
              run: echo "No tests implemented yet"

    # ─────────────────────────────────────────────
    # Job 2: Build & Push
    # ─────────────────────────────────────────────
    build:
        name: Build & Push Images
        needs: test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
                aws-region: ${{ vars.AWS_REGION}}

            - name: Login to Amazon ECR
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build & push backend image
              run: |
                docker build \
                    -t ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPO_BACKEND }}:latest \
                    ./Backend

                docker push \
                    ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPO_BACKEND }}:latest

            - name: Build & push frontend image
              run: |
                docker build \
                    --build-arg VITE_NODE_SERVER_URL=/api \
                    -t ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPO_FRONTEND }}:latest \
                    ./Frontend

                docker push \
                    ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPO_FRONTEND }}:latest

    # ─────────────────────────────────────────────
    # Job 3: Deploy to Kubernetes
    # ─────────────────────────────────────────────
    deploy:
        name: Deploy to EC2 / Kubernetes
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Deploy to EC2
              uses: appleboy/ssh-action@v1.2.2
              with: 
                host: ${{ secrets.FITFLOW_EC2_HOST }}
                username: ${{ secrets.FITFLOW_EC2_USER }}
                key: ${{ secrets.FITFLOW_EC2_SSH_KEY }}
                script: |
                    cd ~/FitFlow

                    echo "Refreshing ECR Kubernetes secret..."

                    kubectl delete secret ecr-secret \
                        -n fitflow \
                        --ignore-not-found

                    kubectl create secret docker-registry ecr-secret \
                        --docker-server=${{ vars.ECR_REGISTRY }} \
                        --docker-username=AWS \
                        --docker-password=$(aws ecr get-login-password \
                            --region ${{ vars.AWS_REGION }}) \
                        --namespace=fitflow

                    echo "Applying Kubernetes manifests..."

                    kubectl apply -f k8s/

                    echo "Restarting deployments..."

                    kubectl rollout restart deployment/backend -n fitflow
                    kubectl rollout restart deployment/frontend -n fitflow

                    echo "Waiting for deployments..."

                    kubectl rollout status deployment/backend \
                        -n fitflow \
                        --timeout=180s

                    kubectl rollout status deployment/frontend \
                        -n fitflow \
                        --timeout=180s

                    echo "Checking pods..."

                    kubectl get pods -n fitflow

                    echo "Deployment successful!"

