apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: fitflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata: 
      labels:
        app: backend

    spec:
      imagePullSecrets:
      - name: ecr-secret

      containers:
      - name: backend
        image: 492094933457.dkr.ecr.ap-south-1.amazonaws.com/prashivgoyal/fitflow-backend:latest
        # EC2 deployment: always pull the latest image from ECR
        imagePullPolicy: Always

        # Local Minikube testing could use IfNotPresent after manually loading images
        # imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8080

        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: NODE_ENV
        
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: PORT

        - name: CORS_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: CORS_ORIGIN
        
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: JWT_SECRET
        
        - name: JWT_EXPIRES_IN
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: JWT_EXPIRES_IN
        
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DATABASE_URL