apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  namespace: fitflow

spec:
  selector:
    matchLabels:
      app: postgres

  serviceName: postgres
  replicas: 1

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine

        ports:
        - containerPort: 5432

        env:
        - name: POSTGRES_DB
          value: fitflow

        - name: POSTGRES_USER
          value: postgres

        - name: POSTGRES_PASSWORD
          valueFrom: 
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data

      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
