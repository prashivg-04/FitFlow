services:
  postgres:
    image: postgres:17-alpine
    container_name: fitflow-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./Backend
    container_name: fitflow-backend

    env_file:
      - ./Backend/.env.docker

    ports:
      - "8080:8080"

    depends_on:
      - postgres

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_NODE_SERVER_URL: http://localhost:8080/api
    container_name: fitflow-frontend

    env_file:
      - ./Frontend/.env.docker

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  postgres-data: